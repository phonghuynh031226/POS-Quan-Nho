spring.application.name=Quan-Nho-Backend-Test
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pos_quan_nho_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database tables are managed by database/database.sql, never by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Cloudinary credentials in tests can be empty
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
